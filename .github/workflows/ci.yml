name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm run build

      # Verify both publishable packages build cleanly so tarball regressions
      # (stray $lib/ imports, broken .d.ts, missing exports) are caught here,
      # not at release. Mirrors what ci:publish does before pnpm publish.
      - run: pnpm run package
      - run: pnpm --filter @walkthru-earth/objex-utils run build

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/

