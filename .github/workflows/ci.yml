name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # objex-utils resolves to its built dist/ via the workspace symlink, so it
      # must be built before any step that type-checks or bundles the app
      # (check, build, package), otherwise every '@walkthru-earth/objex-utils'
      # import fails to resolve on a fresh install.
      - run: pnpm --filter @walkthru-earth/objex-utils run build

      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm run build

      # Verify the Svelte library tarball builds cleanly so regressions
      # (stray $lib/ imports, broken .d.ts, missing exports) are caught here,
      # not at release.
      - run: pnpm run package

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/

